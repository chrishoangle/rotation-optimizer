[project]
name = "rotation-optimizer"
version = "0.1.0"
description = "Constraint-solver for rotation scheduling at networking events."
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.8",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
app = ["streamlit>=1.46"]

[project.scripts]
rotation-optimizer = "rotation_optimizer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
