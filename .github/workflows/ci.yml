name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Report versions
        run: python -c "import platform, ortools; print(platform.python_version(), ortools.__version__)"
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Run example end to end
        run: python examples/stew_dinner.py
