name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Report versions
        run: python -c "import platform, ortools; print(platform.python_version(), ortools.__version__)"
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Run example end to end
        run: python examples/stew_dinner.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test and app extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,app]"
      - name: Run Streamlit app smoke test
        run: python -m pytest tests/test_app.py -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check and test against the Python package's answers
        run: npm run typecheck && npm test
      - name: The committed site in docs/app matches the source
        run: npm run build && git diff --exit-code -- ../docs/app
